name: Fetch mines
on: workflow_dispatch
permissions:
  contents: write
jobs:
  mines:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: pip install requests shapely && python scripts/fetch_mines.py
      - run: echo "::notice::$(python3 -c "import json;d=json.load(open('data/mines/summary.json'));print({k:v['features'] for k,v in d.items() if k!='log'})")"
      - run: |
          git config user.name "mother-lode bot"; git config user.email "actions@github.com"
          git add data/mines && git commit -m "mines: USMIN + MRDS for Tuolumne County" && git pull --rebase && git push
